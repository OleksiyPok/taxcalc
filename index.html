<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trip cost calculator</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">
    <div class="card">
        <header class="header">
            <h1>Trip cost calculator</h1>
            <button type="button" class="btn-icon" id="settingsBtn" aria-label="Open settings" aria-expanded="false" aria-controls="settingsModal">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" width="22" height="22">
                    <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.4-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66Z"/>
                </svg>
            </button>
        </header>

        <div class="layout">
            <section class="form" aria-label="Trip details">
                <div class="field">
                    <label for="km">Distance (km)</label>
                    <input type="number" class="input" id="km" min="0" step="any" value="100" inputmode="decimal">
                </div>

                <div class="field-row">
                    <div class="field">
                        <span class="label" id="driveTimeLabel">Driving time</span>
                        <div class="time-control" role="group" aria-labelledby="driveTimeLabel">
                            <div class="stepper-col">
                                <button type="button" class="btn-step" data-step="driveH" data-dir="1" aria-label="Increase hours">▲</button>
                                <button type="button" class="btn-step" data-step="driveH" data-dir="-1" aria-label="Decrease hours">▼</button>
                            </div>
                            <div class="time-readout">
                                <input type="number" class="time-input" id="driveH" min="0" step="1" value="2" inputmode="numeric" aria-label="Hours">
                                <!-- <span class="time-suffix">h</span> -->
                            </div>
                            <span class="time-sep" aria-hidden="true">:</span>
                            <div class="time-readout">
                                <input type="number" class="time-input" id="driveM" min="0" max="59" step="15" value="0" inputmode="numeric" aria-label="Minutes">
                                <!-- <span class="time-suffix">m</span> -->
                            </div>
                            <div class="stepper-col">
                                <button type="button" class="btn-step" data-step="driveM" data-dir="1" aria-label="Increase minutes">▲</button>
                                <button type="button" class="btn-step" data-step="driveM" data-dir="-1" aria-label="Decrease minutes">▼</button>
                            </div>
                        </div>
                    </div>
                    <div class="field">
                        <span class="label" id="waitTimeLabel">Waiting time</span>
                        <div class="time-control" role="group" aria-labelledby="waitTimeLabel">
                            <div class="stepper-col">
                                <button type="button" class="btn-step" data-step="waitH" data-dir="1" aria-label="Increase waiting hours">▲</button>
                                <button type="button" class="btn-step" data-step="waitH" data-dir="-1" aria-label="Decrease waiting hours">▼</button>
                            </div>
                            <div class="time-readout">
                                <input type="number" class="time-input" id="waitH" min="0" step="1" value="0" inputmode="numeric" aria-label="Waiting hours">
                                <!-- <span class="time-suffix">h</span> -->
                            </div>
                            <span class="time-sep" aria-hidden="true">:</span>
                            <div class="time-readout">
                                <input type="number" class="time-input" id="waitM" min="0" max="59" step="5" value="30" inputmode="numeric" aria-label="Waiting minutes">
                                <!-- <span class="time-suffix">m</span> -->
                            </div>
                            <div class="stepper-col">
                                <button type="button" class="btn-step" data-step="waitM" data-dir="1" aria-label="Increase waiting minutes">▲</button>
                                <button type="button" class="btn-step" data-step="waitM" data-dir="-1" aria-label="Decrease waiting minutes">▼</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="field">
                    <label for="parking">Parking (€)</label>
                    <input type="number" class="input" id="parking" min="0" step="any" value="0" inputmode="decimal">
                </div>

                <button type="button" class="btn btn-primary" id="calcBtn">Calculate</button>
            </section>

            <aside class="result" aria-live="polite">
                <p class="result-label">Total</p>
                <p class="result-total" id="total">€0.00</p>
                <details class="breakdown-details">
                    <summary>Breakdown</summary>
                    <div class="breakdown" id="breakdown"></div>
                </details>
            </aside>
        </div>
    </div>
</div>

<div class="modal-overlay" id="settingsModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modalTitle">Settings</h2>
            <button type="button" class="btn-icon btn-icon--ghost" id="modalClose" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
            <p class="hint">Fuel, wear, and hourly rate. Saved automatically.</p>

            <div class="field">
                <label for="mode">Rate mode</label>
                <select class="input" id="mode">
                    <option value="0">Friends &amp; family</option>
                    <option value="12" selected>Fair share</option>
                    <option value="25">Taxi</option>
                </select>
            </div>

            <div class="field">
                <label for="lper100">Fuel consumption (L / 100 km)</label>
                <input type="number" class="input" id="lper100" min="0" step="any" value="7" inputmode="decimal">
            </div>

            <div class="field">
                <label for="fuelPrice">Fuel price (€/L)</label>
                <input type="number" class="input" id="fuelPrice" min="0" step="any" value="2.6" inputmode="decimal">
            </div>

            <div class="field">
                <label for="amort">Wear &amp; tear (€/km)</label>
                <input type="number" class="input" id="amort" min="0" step="any" value="0.4" inputmode="decimal">
            </div>
        </div>
    </div>
</div>

<script src="js/app.js" defer></script>
</body>
</html>
